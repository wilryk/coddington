[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heliostat"
version = "0.2.0"
description = "Coddington, a twisting heliostat software package. Heliostat-field simulation for concentrating solar power towers: field layouts, ray tracing, flux maps, shading/blocking, DNI, and annual energy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryker Eads" }]
requires-python = ">=3.10"
keywords = [
    "heliostat",
    "concentrating solar power",
    "csp",
    "solar tower",
    "ray tracing",
    "monte carlo",
    "optics",
    "flux map",
    "solar energy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# ruff pinned to the version CI installs, so a fresh dev environment can
# never disagree with CI about formatting.
# httpx is what starlette's TestClient runs on: without it tests/test_web.py
# cannot even be COLLECTED, so `pip install -e .[dev,web]` has to bring it.
# openpyxl is not a runtime dependency (see heliostat.field._read_xy) but
# the suite covers the .xlsx path, so a dev environment needs it.
dev = ["pytest>=8", "pytest-cov", "ruff==0.16.3", "httpx>=0.27", "openpyxl>=3.1"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
heliostat = "heliostat.cli:main"

[project.urls]
Homepage = "https://github.com/wilryk/coddington"
Repository = "https://github.com/wilryk/coddington"
Changelog = "https://github.com/wilryk/coddington/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/heliostat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]
# np.trapezoid needs numpy >= 2.0; our floor is 1.24, so np.trapz stays.
ignore = ["NPY201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
