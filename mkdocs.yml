site_name: heliostat
site_description: Heliostat-field simulation for concentrating solar towers
repo_url: "https://github.com/wilryk/heliostat"

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  # Lets the docs site include the top-level REFERENCES.md verbatim,
  # so the canonical file stays at the repo root where it is visible.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: true

nav:
  - Home: index.md
  - Concepts: guide.md
  - Reproducing the paper: paper.md
  - API reference: api.md
  - References: references.md
